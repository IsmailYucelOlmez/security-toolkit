# Projede .github/workflows/security.yml olarak kaydedin.
# OWNER kısmını kendi GitHub kullanıcı/organizasyon adınızla değiştirin.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"   # her pazartesi 06:17 (TR) — tüm commit geçmişinde sır taraması
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    uses: OWNER/security-toolkit/.github/workflows/security-scan.yml@v2.0.1
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    with:
      fail-on: high
      toolkit-ref: v2.0.1      # üstteki @v2.0.1 ile aynı olmalı; yoksa betikler main'den gelir
      # path: backend          # monorepo'da yalnızca bir alt dizini taramak için
      # skip: trivy
      # upload-sarif: true     # private repoda GitHub Advanced Security varsa (public'te otomatik)
    # Toolkit reposu private ise yalnızca bu secret'ı aktarın (secrets: inherit kullanmayın):
    # secrets:
    #   TOOLKIT_TOKEN: ${{ secrets.TOOLKIT_TOKEN }}
