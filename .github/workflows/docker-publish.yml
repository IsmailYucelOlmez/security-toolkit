# Docker imajını GHCR'ye yayınlar:
#   ghcr.io/<sahip>/security-toolkit:latest   (Python, Flutter, Docker projeleri)
#   ghcr.io/<sahip>/security-toolkit:dotnet   (+ .NET SDK, C# projeleri için)
name: docker-publish

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: [docker/**, scripts/**, rules/**, .github/workflows/docker-publish.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        variant:
          - {name: default, dotnet: "false", suffix: ""}
          - {name: dotnet, dotnet: "true", suffix: "-dotnet"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # GHCR imaj adları küçük harf olmak zorunda (ör. IsmailYucelOlmez → ismailyucelolmez)
      - name: İmaj adı
        id: img
        run: echo "name=ghcr.io/${OWNER,,}/security-toolkit" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.img.outputs.name }}
          flavor: suffix=${{ matrix.variant.suffix }},onlatest=true
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dotnet,enable=${{ matrix.variant.name == 'dotnet' && github.ref == 'refs/heads/main' }},suffix=
            type=semver,pattern={{version}}
            type=sha,format=short

      # Önce yerelde derlenip sınanır; duman testinden geçmeyen imaj yayımlanmaz
      - name: Derle
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          build-args: WITH_DOTNET=${{ matrix.variant.dotnet }}
          load: true
          tags: security-toolkit:smoke
          cache-from: type=gha,scope=${{ matrix.variant.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant.name }}

      - name: Duman testi
        run: |
          mkdir -p /tmp/smoke && echo 'import pickle' > /tmp/smoke/a.py
          docker run --rm -v /tmp/smoke:/src security-toolkit:smoke --fail-on none
          jq -e '.complete == true' /tmp/smoke/security-reports/findings.json

      - name: Yayınla
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          build-args: WITH_DOTNET=${{ matrix.variant.dotnet }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant.name }}
