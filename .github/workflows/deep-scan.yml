# Haftalık / sürüm öncesi derin tarama. Çalışan bir STAGING ortamına saldırı trafiği gönderir;
# yalnızca sahibi olduğunuz veya yazılı izniniz olan hedeflerde kullanın.
#
# İşler (her biri girdisi verilirse çalışır):
#   schemathesis  OpenAPI şemasından binlerce uç durum isteği (500 hataları, şema ihlalleri); yetki hatasında iş başarısız olur
#   zap           OWASP ZAP API taraması (şema varsa) veya pasif baseline taraması
#   strix         Kaynak kod + canlı adres üzerinde AI pentest
#   mobsf         Flutter APK'sını derleyip MobSF ile statik analiz
#
# Repo secrets:
#   TEST_USER_EMAIL, TEST_USER_PASSWORD  login-url verilirse; her iş taramadan önce giriş yapıp taze token alır
#   TEST_USER_B_EMAIL, TEST_USER_B_PASSWORD  isteğe bağlı ikinci kullanıcı; Schemathesis'te IDOR kontrolünü açar
#   API_AUTH_HEADER                 login-url yoksa isteğe bağlı sabit başlık, ör. API anahtarı
#   STRIX_LLM, LLM_API_KEY          strix için
name: deep-scan

on:
  workflow_call:
    inputs:
      authorized:
        description: "Hedefin sahibi olduğunuzu / yazılı izniniz olduğunu onaylayın (true olmalı)"
        type: boolean
        required: true
      openapi-url:
        description: "OpenAPI şema adresi (ör. https://staging-api.ornek.com/openapi.json)"
        type: string
        default: ""
      base-url:
        description: "API veya web uygulaması taban adresi"
        type: string
        default: ""
      login-url:
        description: "Test kullanıcısının giriş adresi; boşsa API_AUTH_HEADER kullanılır"
        type: string
        default: ""
      login-format:
        description: "Giriş isteğinin biçimi: form (FastAPI OAuth2) veya json"
        type: string
        default: form
      login-user-field:
        type: string
        default: username
      login-password-field:
        type: string
        default: password
      login-token-field:
        description: "Yanıttaki token alanı; iç içe ise noktalı (ör. data.token)"
        type: string
        default: access_token
      schemathesis-max-time:
        description: "Schemathesis süre bütçesi (saniye)"
        type: number
        default: 600
      zap:
        type: boolean
        default: true
      strix:
        type: boolean
        default: false
      strix-scan-mode:
        type: string
        default: quick
      strix-fail-on-finding:
        description: "Strix'in doğrulanmış bulgusu işi başarısız yapsın"
        type: boolean
        default: true
      flutter-dir:
        description: "Flutter projesinin dizini (boşsa MobSF çalışmaz)"
        type: string
        default: ""
      toolkit-repository:
        type: string
        default: ""
      toolkit-ref:
        type: string
        default: main
    secrets:
      TEST_USER_EMAIL:
        required: false
      TEST_USER_PASSWORD:
        required: false
      TEST_USER_B_EMAIL:
        required: false
      TEST_USER_B_PASSWORD:
        required: false
      API_AUTH_HEADER:
        required: false
      STRIX_LLM:
        required: false
      LLM_API_KEY:
        required: false
      TOOLKIT_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Bulgular yalnızca log, özet ve artifact'te tutulur; bunlar public repoda herkese açıktır.
      - name: Repo görünürlüğü
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          value=$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility 2>/dev/null || echo unknown)
          if [[ "$value" != "private" && "$value" != "internal" ]]; then
            echo "::error::Derin tarama yalnızca private repoda çalışır (görünürlük: $value). Bulgular herkese açık log ve artifact'lere yazılırdı."
            exit 1
          fi
      - name: Yetki onayı
        if: ${{ !inputs.authorized }}
        run: |
          echo "::error::Derin tarama hedefe saldırı trafiği gönderir. Çağıran workflow'da 'authorized: true' verin (yalnızca kendi staging ortamınız için)."
          exit 1
      - name: Hedef kontrolü
        env:
          TARGETS: ${{ inputs.openapi-url }} ${{ inputs.base-url }} ${{ inputs.login-url }}
        run: |
          for t in $TARGETS; do
            if [[ ! "$t" =~ (staging|stage|test|dev|preview|localhost|127\.0\.0\.1) ]]; then
              echo "::warning::'$t' bir test ortamı adresine benzemiyor. Canlı (production) sistemi taramadığınızdan emin olun."
            fi
          done

  schemathesis:
    needs: guard
    if: inputs.openapi-url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_USER_B: ${{ secrets.TEST_USER_B_EMAIL != '' }}
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ inputs.toolkit-repository || format('{0}/security-toolkit', github.repository_owner) }}
          ref: ${{ inputs.toolkit-ref }}
          path: .security-toolkit
          token: ${{ secrets.TOOLKIT_TOKEN || github.token }}
          persist-credentials: false
      - run: pip install -q -r .security-toolkit/scripts/requirements-deep.txt
      # Bilerek açıklı yerel API'de IDOR bulunamıyorsa staging sonucuna güvenilemez
      - name: Kanarya
        run: python3 .security-toolkit/tests/e2e_authz.py
      # Maskeli değerler job çıktısıyla taşınamadığı için her iş kendi girişini yapar
      - name: Test kullanıcısıyla giriş
        id: login
        if: inputs.login-url != ''
        env:
          LOGIN_URL: ${{ inputs.login-url }}
          LOGIN_FORMAT: ${{ inputs.login-format }}
          LOGIN_USER_FIELD: ${{ inputs.login-user-field }}
          LOGIN_PASSWORD_FIELD: ${{ inputs.login-password-field }}
          LOGIN_TOKEN_FIELD: ${{ inputs.login-token-field }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: python3 .security-toolkit/scripts/login.py
      - name: İkinci test kullanıcısıyla giriş
        id: login_b
        if: inputs.login-url != '' && env.HAS_USER_B == 'true'
        env:
          LOGIN_URL: ${{ inputs.login-url }}
          LOGIN_FORMAT: ${{ inputs.login-format }}
          LOGIN_USER_FIELD: ${{ inputs.login-user-field }}
          LOGIN_PASSWORD_FIELD: ${{ inputs.login-password-field }}
          LOGIN_TOKEN_FIELD: ${{ inputs.login-token-field }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_B_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_B_PASSWORD }}
        run: python3 .security-toolkit/scripts/login.py
      - name: Schemathesis
        env:
          AUTH_HEADER_A: ${{ steps.login.outputs.header || secrets.API_AUTH_HEADER }}
          AUTH_HEADER_B: ${{ steps.login_b.outputs.header }}
          OPENAPI: ${{ inputs.openapi-url }}
          BASE: ${{ inputs.base-url }}
          MAX_TIME: ${{ inputs.schemathesis-max-time }}
        run: bash .security-toolkit/scripts/run_schemathesis.sh
      - name: Raporlarda token kontrolü
        id: tokens
        if: always()
        env:
          AUTH_HEADER_A: ${{ steps.login.outputs.header || secrets.API_AUTH_HEADER }}
          AUTH_HEADER_B: ${{ steps.login_b.outputs.header }}
        run: |
          mkdir -p deep-reports
          python3 .security-toolkit/scripts/redact_tokens.py deep-reports --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.tokens.outcome == 'success'
        with:
          name: deep-schemathesis
          path: deep-reports/

  zap:
    needs: guard
    if: inputs.zap && (inputs.openapi-url != '' || inputs.base-url != '')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ inputs.toolkit-repository || format('{0}/security-toolkit', github.repository_owner) }}
          ref: ${{ inputs.toolkit-ref }}
          path: .security-toolkit
          token: ${{ secrets.TOOLKIT_TOKEN || github.token }}
          persist-credentials: false
      - name: Test kullanıcısıyla giriş
        id: login
        if: inputs.login-url != ''
        env:
          LOGIN_URL: ${{ inputs.login-url }}
          LOGIN_FORMAT: ${{ inputs.login-format }}
          LOGIN_USER_FIELD: ${{ inputs.login-user-field }}
          LOGIN_PASSWORD_FIELD: ${{ inputs.login-password-field }}
          LOGIN_TOKEN_FIELD: ${{ inputs.login-token-field }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: python3 .security-toolkit/scripts/login.py
      - name: OWASP ZAP
        env:
          ZAP_AUTH_HEADER_VALUE: ${{ steps.login.outputs.header || secrets.API_AUTH_HEADER }}
          OPENAPI: ${{ inputs.openapi-url }}
          BASE: ${{ inputs.base-url }}
        run: |
          mkdir -p zap && chmod 777 zap
          envs=()
          [[ -n "$ZAP_AUTH_HEADER_VALUE" ]] && envs+=(-e ZAP_AUTH_HEADER_VALUE)
          if [[ -n "$OPENAPI" ]]; then
            # Şemadaki tüm uç noktalara aktif tarama
            cmd=(zap-api-scan.py -t "$OPENAPI" -f openapi)
            [[ -n "$BASE" ]] && cmd+=(-O "$BASE")
          else
            # Şema yoksa yalnızca pasif tarama (hedefe saldırı yükü gönderilmez)
            cmd=(zap-baseline.py -t "$BASE")
          fi
          set +e
          # Dependabot bu satırı göremez; digest'i elle güncelleyin
          docker run --rm "${envs[@]}" -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238 \
            "${cmd[@]}" -J zap.json -x zap.xml -r zap.html -I
          set -e
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, collections
          risk = {"3": "🟠 Yüksek", "2": "🟡 Orta", "1": "🔵 Düşük", "0": "⚪ Bilgi"}
          try:
              data = json.load(open("zap/zap.json"))
          except Exception as e:
              print(f"## 🕷️ OWASP ZAP\n\nRapor okunamadı: {e}"); raise SystemExit
          alerts = [a for s in data.get("site", []) for a in s.get("alerts", [])]
          c = collections.Counter(a.get("riskcode") for a in alerts)
          print("## 🕷️ OWASP ZAP\n")
          print(" · ".join(f"{risk[k]}: **{c.get(k, 0)}**" for k in ("3", "2", "1", "0")) + "\n")
          for a in sorted(alerts, key=lambda a: -int(a.get("riskcode", 0)))[:20]:
              if a.get("riskcode") in ("3", "2"):
                  print(f"- {risk[a['riskcode']]} — {a.get('name')} ({a.get('count', '?')} örnek)")
          EOF
      # ZAP istek başlıklarını rapora yazabilir; ::add-mask:: artifact'leri korumaz
      - name: Raporlarda token'ları maskele
        id: tokens
        if: always()
        env:
          AUTH_HEADER_A: ${{ steps.login.outputs.header || secrets.API_AUTH_HEADER }}
        run: |
          mkdir -p zap
          sudo chown -R "$(id -u)" zap
          python3 .security-toolkit/scripts/redact_tokens.py zap
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.tokens.outcome == 'success'
        with:
          name: deep-zap
          path: zap/

  strix:
    needs: guard
    # Yalnızca elle: PR tetiklemesinde güvenilmeyen kod, LLM anahtarı ve token aynı işte birleşirdi
    if: inputs.strix && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HAS_USER_B: ${{ secrets.TEST_USER_B_EMAIL != '' }}
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Sürüm sandbox imajını da sabitler
      - name: Strix kur
        run: pip install -q "strix-agent==1.7.0"
      # Toolkit taranmasın diye proje ayrı dizine alınır
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ inputs.toolkit-repository || format('{0}/security-toolkit', github.repository_owner) }}
          ref: ${{ inputs.toolkit-ref }}
          path: .security-toolkit
          token: ${{ secrets.TOOLKIT_TOKEN || github.token }}
          persist-credentials: false
      - name: Test kullanıcısıyla giriş
        id: login
        if: inputs.login-url != ''
        env:
          LOGIN_URL: ${{ inputs.login-url }}
          LOGIN_FORMAT: ${{ inputs.login-format }}
          LOGIN_USER_FIELD: ${{ inputs.login-user-field }}
          LOGIN_PASSWORD_FIELD: ${{ inputs.login-password-field }}
          LOGIN_TOKEN_FIELD: ${{ inputs.login-token-field }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: python3 .security-toolkit/scripts/login.py
      - name: İkinci test kullanıcısıyla giriş
        id: login_b
        if: inputs.login-url != '' && env.HAS_USER_B == 'true'
        env:
          LOGIN_URL: ${{ inputs.login-url }}
          LOGIN_FORMAT: ${{ inputs.login-format }}
          LOGIN_USER_FIELD: ${{ inputs.login-user-field }}
          LOGIN_PASSWORD_FIELD: ${{ inputs.login-password-field }}
          LOGIN_TOKEN_FIELD: ${{ inputs.login-token-field }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_B_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_B_PASSWORD }}
        run: python3 .security-toolkit/scripts/login.py
      - name: Sandbox ağ çıkışını sınırla
        env:
          BASE: ${{ inputs.base-url }}
        run: bash .security-toolkit/scripts/strix_egress.sh
      - name: Strix AI pentest
        env:
          STRIX_FAIL_ON_FINDING: ${{ inputs.strix-fail-on-finding }}
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          STRIX_TELEMETRY: "false"
          AUTH_HEADER_A: ${{ steps.login.outputs.header || secrets.API_AUTH_HEADER }}
          AUTH_HEADER_B: ${{ steps.login_b.outputs.header }}
          BASE: ${{ inputs.base-url }}
          MODE: ${{ inputs.strix-scan-mode }}
          TARGET_DIR: ./project
        run: bash .security-toolkit/scripts/run_strix.sh
      # Strix talimatı strix_runs/ altına kaydeder; ::add-mask:: artifact'leri korumaz
      - name: Raporlarda token'ları maskele
        id: tokens
        if: always()
        env:
          AUTH_HEADER_A: ${{ steps.login.outputs.header || secrets.API_AUTH_HEADER }}
          AUTH_HEADER_B: ${{ steps.login_b.outputs.header }}
        run: |
          mkdir -p strix_runs
          python3 .security-toolkit/scripts/redact_tokens.py strix_runs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.tokens.outcome == 'success'
        with:
          name: deep-strix
          path: strix_runs/
          retention-days: 14
          if-no-files-found: ignore

  mobsf:
    needs: guard
    if: inputs.flutter-dir != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mobsf:
        image: opensecurity/mobile-security-framework-mobsf:latest@sha256:e5d65aec0385810d31ce95d06396b06ed74712d01bb2f0d12bc3deabaf28ccb9
        ports: ["8000:8000"]
        env:
          MOBSF_API_KEY: ci-only-local-key   # yalnızca bu iş içinde, localhost'ta erişilebilir
    env:
      MOBSF_API_KEY: ci-only-local-key
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ inputs.toolkit-repository || format('{0}/security-toolkit', github.repository_owner) }}
          ref: ${{ inputs.toolkit-ref }}
          path: .security-toolkit
          token: ${{ secrets.TOOLKIT_TOKEN || github.token }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: APK derle
        working-directory: ${{ inputs.flutter-dir }}
        run: flutter pub get && flutter build apk --release
      - name: MobSF analizi
        working-directory: ${{ inputs.flutter-dir }}
        run: |
          for _ in $(seq 1 60); do curl -sf http://localhost:8000/ >/dev/null && break; sleep 5; done
          apk=build/app/outputs/flutter-apk/app-release.apk
          H=(-H "Authorization: $MOBSF_API_KEY")
          hash=$(curl -sSf "${H[@]}" -F "file=@$apk" http://localhost:8000/api/v1/upload | python3 -c 'import sys,json;print(json.load(sys.stdin)["hash"])')
          curl -sSf "${H[@]}" -X POST --data "hash=$hash" http://localhost:8000/api/v1/scan >/dev/null
          mkdir -p "$GITHUB_WORKSPACE/deep-reports"
          curl -sSf "${H[@]}" -X POST --data "hash=$hash" http://localhost:8000/api/v1/report_json -o "$GITHUB_WORKSPACE/deep-reports/mobsf.json"
          curl -sSf "${H[@]}" -X POST --data "hash=$hash" http://localhost:8000/api/v1/scorecard -o "$GITHUB_WORKSPACE/deep-reports/mobsf-scorecard.json"
          curl -sSf "${H[@]}" -X POST --data "hash=$hash" http://localhost:8000/api/v1/download_pdf -o "$GITHUB_WORKSPACE/deep-reports/mobsf.pdf" || true
          python3 "$GITHUB_WORKSPACE/.security-toolkit/scripts/mobsf_summary.py" "$GITHUB_WORKSPACE/deep-reports/mobsf-scorecard.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: deep-mobsf
          path: deep-reports/
          if-no-files-found: ignore

  # Çalışan işlerin raporları tek şemada toplanır. Strix'in çıktı biçimi sözleşmeli olmadığı için dışarıda kalır.
  report:
    needs: [guard, schemathesis, zap, mobsf]
    if: always() && needs.guard.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ inputs.toolkit-repository || format('{0}/security-toolkit', github.repository_owner) }}
          ref: ${{ inputs.toolkit-ref }}
          path: .security-toolkit
          token: ${{ secrets.TOOLKIT_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: deep-*
      - name: Tek rapor
        run: |
          mkdir -p deep-findings/schemathesis
          cp artifacts/deep-zap/zap.json deep-findings/ 2>/dev/null || true
          cp artifacts/deep-mobsf/mobsf-scorecard.json deep-findings/ 2>/dev/null || true
          cp artifacts/deep-schemathesis/schemathesis/*.xml deep-findings/schemathesis/ 2>/dev/null || true
          python3 .security-toolkit/scripts/summarize.py --reports deep-findings --target . --fail-on none
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deep-findings
          path: |
            deep-findings/findings.json
            deep-findings/summary.md
