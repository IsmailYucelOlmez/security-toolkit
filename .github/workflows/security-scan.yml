# Yeniden kullanılabilir güvenlik taraması.
# Projelerden çağırmak için: examples/security.yml
name: security-scan

on:
  workflow_call:
    inputs:
      fail-on:
        description: "Bu derece ve üstünde bulgu varsa iş başarısız olur (critical|high|medium|low|none)"
        type: string
        default: high
      path:
        description: "Taranacak alt dizin (monorepo için)"
        type: string
        default: "."
      skip:
        description: "Atlanacak araçlar, virgülle (gitleaks,osv,pip-audit,bandit,semgrep,trivy,dotnet)"
        type: string
        default: ""
      semgrep-config:
        description: "Semgrep kural seti"
        type: string
        default: p/default
      upload-sarif:
        description: "Private repoda sonuçları GitHub Code Scanning'e yükle (GHAS gerekir). Public repoda PR dışındaki taramalar her zaman yüklenir"
        type: boolean
        default: false
      comment-on-pr:
        description: "PR'a özet yorumu yaz/güncelle (public repoda yazılmaz)"
        type: boolean
        default: true
      toolkit-repository:
        description: "Toolkit reposu (boşsa <sahip>/security-toolkit)"
        type: string
        default: ""
      toolkit-ref:
        description: "Toolkit dalı/etiketi"
        type: string
        default: main
    secrets:
      TOOLKIT_TOKEN:
        description: "Toolkit reposu private ise okuma yetkili token"
        required: false
    outputs:
      failed:
        description: "Eşik aşıldıysa 'true'"
        value: ${{ jobs.scan.outputs.failed }}

jobs:
  scan:
    name: Güvenlik taraması
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    outputs:
      failed: ${{ steps.scan.outputs.failed }}
    env:
      SECURITY_TOOLS_DIR: ${{ github.workspace }}/.security-tools
      SEMGREP_CONFIG: ${{ inputs.semgrep-config }}
    steps:
      # Public repoda log, iş özeti, artifact ve PR yorumu herkese açıktır; bulgular buralara yazılmaz.
      # Görünürlük doğrulanamazsa da repo public sayılır.
      - name: Repo görünürlüğü
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          value=$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility 2>/dev/null || echo unknown)
          case "$value" in
            private|internal) hide=false ;;
            *) hide=true ;;
          esac
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "hide=$hide" >> "$GITHUB_OUTPUT"
          if [[ "$hide" == "true" ]]; then
            echo "Repo görünürlüğü \`$value\`: bulgular log, özet, artifact ve PR yorumunda gösterilmez." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Projeyi al
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0   # gitleaks'in PR commit aralığını görebilmesi için

      - name: Toolkit'i al
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ inputs.toolkit-repository || format('{0}/security-toolkit', github.repository_owner) }}
          ref: ${{ inputs.toolkit-ref }}
          path: .security-toolkit
          token: ${{ secrets.TOOLKIT_TOKEN || github.token }}
          persist-credentials: false

      - name: Yığını algıla
        id: detect
        shell: bash
        run: |
          if find "${{ inputs.path }}" -name '*.csproj' -not -path '*/.security-toolkit/*' | grep -q .; then
            echo "dotnet=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: .NET SDK
        if: steps.detect.outputs.dotnet == 'true' && !contains(inputs.skip, 'dotnet')
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 8.0.x

      - name: Araç önbelleği
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SECURITY_TOOLS_DIR }}
          # Sürümler sabit olduğu için anahtar yalnızca sabitleme dosyaları değişince değişir
          key: security-tools-${{ runner.os }}-${{ hashFiles('.security-toolkit/scripts/requirements-tools.txt', '.security-toolkit/scripts/tool-checksums.txt') }}

      - name: Araçları kur
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash .security-toolkit/scripts/install-tools.sh

      - name: PATH
        run: echo "$SECURITY_TOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Tara
        id: scan
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HIDE_REPORTS: ${{ steps.visibility.outputs.hide }}
        run: |
          args=(--path "${{ inputs.path }}" --out "$GITHUB_WORKSPACE/security-reports" --fail-on "${{ inputs.fail-on }}")
          [[ -n "${{ inputs.skip }}" ]] && args+=(--skip "${{ inputs.skip }}")
          # PR'larda sır taraması yalnızca yeni commit'lere bakar (geçmiş, push/schedule taramasında taranır)
          [[ -n "$BASE_REF" ]] && args+=(--diff-base "origin/$BASE_REF")
          set +e
          if [[ "$HIDE_REPORTS" == "false" ]]; then
            bash .security-toolkit/scripts/scan.sh "${args[@]}"
          else
            env -u GITHUB_STEP_SUMMARY bash .security-toolkit/scripts/scan.sh "${args[@]}" > /dev/null
          fi
          rc=$?
          set -e
          [[ $rc -eq 1 ]] && echo "failed=true" >> "$GITHUB_OUTPUT" || echo "failed=false" >> "$GITHUB_OUTPUT"
          [[ $rc -eq 3 ]] && echo "incomplete=true" >> "$GITHUB_OUTPUT" || echo "incomplete=false" >> "$GITHUB_OUTPUT"
          if [[ "$HIDE_REPORTS" != "false" ]]; then
            # Araç notları dosya yolu içerebilir; public repoda yalnızca araç ve durum yazılır
            { echo "### Araç durumu"; jq -r '.tools[] | "- \(.tool): \(.status)"' security-reports/findings.json || echo "- rapor oluşmadı"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ $rc -eq 3 ]]; then
            echo "::error::Tarama eksik: en az bir araç çalışmadı veya raporu okunamadı. Bu sonuç temiz tarama sayılmaz; araç durumu iş özetinde."
          fi
          [[ $rc -gt 1 ]] && exit $rc || true

      - name: Raporları yükle
        if: always() && steps.visibility.outputs.hide == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-reports
          path: security-reports/
          retention-days: 30

      # Okuma yetkisi olan herkes PR'daki Code Scanning notlarını görür; public repoda PR taraması yüklenmez.
      # Eksik tarama yüklenmez: çalışmayan aracın eski uyarıları düzeltilmiş gibi kapanırdı.
      - name: Code Scanning'e yükle
        if: always() && steps.scan.outputs.incomplete == 'false' && hashFiles('security-reports/findings.sarif') != '' && ((steps.visibility.outputs.value == 'public' && github.event_name != 'pull_request') || (steps.visibility.outputs.hide == 'false' && inputs.upload-sarif))
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: security-reports/findings.sarif
          category: security-toolkit

      - name: PR yorumu
        if: always() && inputs.comment-on-pr && steps.visibility.outputs.hide == 'false' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('security-reports/summary.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker="<!-- security-toolkit -->"
          { echo "$marker"; cat security-reports/summary.md; echo; echo "[Tüm raporlar]($RUN_URL)"; } > comment.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
               --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | tail -1)
          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md >/dev/null
          fi

      - name: Eşik kontrolü
        if: steps.scan.outputs.failed == 'true'
        env:
          DETAILS: ${{ steps.visibility.outputs.hide == 'false' && 'Ayrıntılar iş özetinde.' || 'Ayrıntılar main taramasından sonra Security sekmesinde veya yerel taramada.' }}
        run: |
          echo "::error::'${{ inputs.fail-on }}' veya üstü derecede güvenlik bulgusu var. $DETAILS"
          exit 1
