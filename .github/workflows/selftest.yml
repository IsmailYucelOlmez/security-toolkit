name: selftest

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Şablondaki pre-commit kopyası güncel mi
        run: diff -u pre-commit/.pre-commit-config.yaml template/project/.pre-commit-config.yaml
      - name: Birim testleri
        run: python -m unittest discover tests -v
      - name: Uçtan uca yetki testi
        run: |
          pip install -q "schemathesis>=4.33,<5"
          python tests/e2e_authz.py
      - name: Yetki matrisi örneği
        run: |
          pip install -q fastapi httpx pytest
          pytest examples/authz -q
      - name: Kabuk betikleri
        run: shellcheck -S warning scripts/*.sh docker/*.sh
      - name: Semgrep kurallarını doğrula
        run: |
          pip install -q -r scripts/requirements-tools.txt
          semgrep --validate --metrics=off --config rules/semgrep
      - name: Araç kurulumu çalışıyor mu
        run: bash scripts/install-tools.sh && ~/.security-tools/bin/gitleaks version && ~/.security-tools/bin/osv-scanner --version && ~/.security-tools/bin/trivy --version
      - name: Özeti tutmayan araç kurulmuyor mu
        run: |
          work="$(mktemp -d)"
          cp scripts/install-tools.sh scripts/requirements-tools.txt "$work/"
          sed -E 's/ [0-9a-f]{64}$/ '"$(printf '0%.0s' {1..64})"'/' scripts/tool-checksums.txt > "$work/tool-checksums.txt"
          if SECURITY_TOOLS_DIR="$work/tools" bash "$work/install-tools.sh" --only osv; then
            echo "::error::Bozuk özetle kurulum başarılı oldu"; exit 1
          fi
          test ! -e "$work/tools/bin/osv-scanner"
      - name: Şablon kendi taramasından geçiyor mu
        run: |
          pip install -q copier
          copier copy --trust --defaults --vcs-ref=HEAD -d github_owner=ornek -d project_name=ornek -d 'stacks=[python,flutter,dotnet,docker]' -d deep_scan=true . "$RUNNER_TEMP/sablon"
          git -C "$RUNNER_TEMP/sablon" init -q
          git -C "$RUNNER_TEMP/sablon" add -A
          bash scripts/scan.sh --path "$RUNNER_TEMP/sablon" --only semgrep --fail-on high
