version: 2
updates:
  - package-ecosystem: pip
    directory: /scripts
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /docker
    schedule: {interval: weekly}
    ignore:
      # semgrep'in 3.15 wheel'i yok; yayınlandığında bu kural kaldırılmalı
      - {dependency-name: python, versions: [">=3.15"]}
