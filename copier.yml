# Güvenlik yapılandırmasını bir projeye uygular.
#
#   Yeni veya mevcut proje:  copier copy gh:OWNER/security-toolkit .
#   Şablon değişince:        copier recopy -a .security-toolkit-answers.yml --defaults --overwrite
#
# Şablon dosyaları template/project altındadır.
_min_copier_version: "9.3.0"
_subdirectory: template/project
_answers_file: .security-toolkit-answers.yml
_skip_if_exists:
  - .security-ignore.yml   # projeye özgü bastırmalar güncellemede ezilmez
  - tests/test_authz_matrix.py   # proje için doldurulan matris güncellemede ezilmez
_message_after_copy: |
  Güvenlik yapılandırması eklendi. Sonraki adımlar:
    1. pip install pre-commit && pre-commit install
    2. pre-commit run --all-files     (mevcut kodu bir kez kontrol et)
    3. Değişiklikleri commit'leyip push'la; ilk tarama Actions sekmesinde çalışır.
  {%- if deep_scan %}
    4. Strix'i kullanacaksanız repo Settings > Secrets bölümüne STRIX_LLM ve LLM_API_KEY ekleyin.
       {%- if api_login_url %}
       Giriş için TEST_USER_EMAIL ve TEST_USER_PASSWORD ekleyin; yalnızca staging'de olan bir hesap kullanın.
       IDOR kontrolü için ikinci bir staging hesabıyla TEST_USER_B_EMAIL ve TEST_USER_B_PASSWORD ekleyin.
       {%- endif %}
  {%- endif %}

github_owner:
  type: str
  help: security-toolkit reposunun sahibi (GitHub kullanıcı veya organizasyon adı)
  validator: "{% if not github_owner %}Zorunlu alan{% endif %}"

toolkit_ref:
  type: str
  help: Kullanılacak toolkit sürüm etiketi (ör. v2.0.2) veya daha sıkı sabitleme için 40 karakterlik commit SHA'sı
  default: v2.0.2
  validator: "{% if not (toolkit_ref | regex_search('^(v[0-9]+(\\.[0-9]+)*|[0-9a-f]{40})$')) %}Dal adı kullanılamaz: sürüm etiketi (ör. v2.0.2) veya tam commit SHA'sı girin{% endif %}"

toolkit_private:
  type: bool
  help: Toolkit reposu private mı? (evetse projelere TOOLKIT_TOKEN secret'ı aktarılır)
  default: false

project_name:
  type: str
  help: Proje adı
  default: "{{ _folder_name if _folder_name is defined else 'proje' }}"

stacks:
  type: str
  help: Projede hangi yığınlar var?
  multiselect: true
  choices:
    Python / FastAPI: python
    Flutter / Dart: flutter
    C# / .NET: dotnet
    Docker: docker
  default: [python]

python_dir:
  type: str
  help: Python bağımlılık dosyalarının bulunduğu dizin (Dependabot için)
  default: /
  when: "{{ 'python' in stacks }}"

flutter_dir:
  type: str
  help: pubspec.yaml dizini
  default: /
  when: "{{ 'flutter' in stacks }}"

dotnet_dir:
  type: str
  help: .sln/.csproj dizini
  default: /
  when: "{{ 'dotnet' in stacks }}"

docker_dir:
  type: str
  help: Dockerfile dizini
  default: /
  when: "{{ 'docker' in stacks }}"

authz_matrix:
  type: bool
  help: FastAPI yetki matrisi testi (tests/test_authz_matrix.py) eklensin mi? Projeye göre doldurmanız gerekir
  default: false
  when: "{{ 'python' in stacks }}"

fail_on:
  type: str
  help: PR hangi dereceden itibaren başarısız sayılsın?
  choices: [critical, high, medium, low, none]
  default: high

upload_sarif:
  type: bool
  help: Private repoda bulgular GitHub Security sekmesine yüklensin mi? (GitHub Advanced Security gerekir; public repoda otomatik)
  default: false

deep_scan:
  type: bool
  help: Haftalık derin tarama (Schemathesis, ZAP, Strix, MobSF) eklensin mi? (yalnızca private repoda çalışır)
  default: false

api_openapi_url:
  type: str
  help: Staging API'nin OpenAPI şema adresi (ör. https://staging-api.ornek.com/openapi.json)
  default: ""
  when: "{{ deep_scan }}"

api_base_url:
  type: str
  help: Staging API taban adresi (boşsa şemadaki adres kullanılır)
  default: ""
  when: "{{ deep_scan }}"

api_login_url:
  type: str
  help: Taramadan önce test kullanıcısıyla giriş adresi (ör. https://staging-api.ornek.com/auth/token). Boşsa sabit API_AUTH_HEADER kullanılır
  default: ""
  when: "{{ deep_scan }}"
  validator: "{% if api_login_url and not api_login_url.startswith('https://') %}Giriş adresi https olmalı{% endif %}"

api_login_format:
  type: str
  help: Giriş isteğinin biçimi (FastAPI OAuth2 için form)
  choices: [form, json]
  default: form
  when: "{{ deep_scan and api_login_url }}"

api_login_user_field:
  type: str
  help: İstekteki kullanıcı alanının adı (ör. username, email)
  default: username
  when: "{{ deep_scan and api_login_url }}"

api_login_token_field:
  type: str
  help: Yanıttaki token alanı; iç içe ise noktalı (ör. access_token, data.token)
  default: access_token
  when: "{{ deep_scan and api_login_url }}"
